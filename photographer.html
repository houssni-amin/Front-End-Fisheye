<!DOCTYPE html>
<html lang="fr">
  <head>
    <link href="css/style.css" rel="stylesheet" type="text/css" />
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" href="assets/favicon.png" />
    <link
      href="https://fonts.googleapis.com/css?family=DM+Sans&display=swap"
      rel="stylesheet"
    />
    <title>Fisheye - photographe</title>
  </head>
  <body>
    <header>
      <a href="index.html" aria-label="Retour à la page d'accueil">
        <img
          src="assets/images/logo.png"
          class="logo"
          alt="Fisheye Home page"
        />
      </a>
    </header>
    <main id="main">
      <div class="photograph-header">
        <button class="contact-button">Contactez-moi</button>
      </div>
    </main>

    <div id="contact-modal" role="dialog" aria-label="Formulaire de contact">
      <div class="modal">
        <header>
          <div class="header-modal-left"><h2>Contactez-moi</h2></div>
          <button
            class="modal-close-btn"
            aria-label="Fermer le formulaire de contact"
          >
            <img src="assets/icons/close.svg" alt="" />
          </button>
        </header>
        <form>
          <div>
            <label for="prenom">Prénom</label>
            <input id="prenom" name="prenom" type="text" />
          </div>
          <div>
            <label for="nom">Nom</label>
            <input id="nom" name="nom" type="text" />
          </div>
          <div>
            <label for="email">Email</label>
            <input id="email" name="email" type="email" />
          </div>
          <div>
            <label for="message">Votre message</label>
            <textarea id="message" name="message"></textarea>
          </div>
          <button class="contact-button">Envoyer</button>
        </form>
      </div>
    </div>

    <script src="scripts/pages/photographer.js"></script>
    <script src="scripts/utils/contactForm.js"></script>
  </body>
</html>
